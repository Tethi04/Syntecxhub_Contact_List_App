<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Contacts App 🌸 - Web Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Ambient Glass Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Main Glass Container -->
    <div class="app-card">
        <header class="header">
            <h1>My Contacts 🌸</h1>
            <p class="subtitle">Syntecxhub Android Internship Project Demo</p>
        </header>

        <!-- Search & Add Bar -->
        <div class="action-bar">
            <input type="text" id="searchInput" placeholder="Search contact by name or phone...">
            <button id="openAddBtn" class="btn-primary">+ Add</button>
        </div>

        <!-- Contact List Container -->
        <div id="contactList" class="contact-list">
            <!-- Dynamic Cards Generated by JS -->
        </div>
    </div>

    <!-- Add Contact Modal -->
    <div id="addModal" class="modal hidden">
        <div class="modal-content glass-box">
            <h2>Add New Contact 🌸</h2>
            <input type="text" id="addName" placeholder="Full Name">
            <input type="text" id="addPhone" placeholder="Phone Number">
            <input type="email" id="addEmail" placeholder="Email Address">
            <div class="modal-actions">
                <button id="closeAddBtn" class="btn-secondary">Cancel</button>
                <button id="saveContactBtn" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Contact Detail Modal -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content glass-box text-center">
            <div id="detailAvatar" class="big-avatar">A</div>
            <h2 id="detailName">Anjali Sharma</h2>
            <p id="detailPhone" class="phone-text">+91 98123 45678</p>
            <p id="detailEmail" class="email-text">anjali@example.com</p>

            <div class="modal-actions horizontal">
                <a id="callBtn" href="#" class="btn-primary flex-1">Call</a>
                <a id="smsBtn" href="#" class="btn-secondary flex-1">Message</a>
            </div>
            <button id="deleteBtn" class="btn-danger w-full">Delete Contact</button>
            <button id="closeDetailBtn" class="btn-text">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
